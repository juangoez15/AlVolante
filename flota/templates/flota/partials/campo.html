{% comment %}Campo de formulario con etiqueta, errores y texto de ayuda.{% endcomment %}
<div class="mb-3">
  <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% for error in campo.errors %}<div class="error-msg">{{ error }}</div>{% endfor %}
  {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
</div>
